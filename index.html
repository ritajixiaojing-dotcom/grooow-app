<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>grooow - 小红书文案一键生成</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#FF2442">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="grooow">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23FF2442'/><path d='M35 65 C35 45 45 35 65 35 C65 55 55 65 35 65 Z' fill='%23FFFFFF'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23FF2442'/><path d='M35 65 C35 45 45 35 65 35 C65 55 55 65 35 65 Z' fill='%23FFFFFF'/></svg>">

    <!-- CSS & Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.staticfile.net/vue/3.3.4/vue.global.prod.js"></script>
    <script src="https://js.puter.com/v2/"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        [v-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-[#F6F7F9] text-[#1F2329] min-h-screen pb-16 antialiased">

<div id="app" v-cloak class="max-w-md mx-auto px-4 pt-6 sm:pt-10">
    
    <!-- Top Header -->
    <header class="flex items-center justify-between mb-5">
        <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-2xl bg-[#FF2442] flex items-center justify-center text-white shadow-md shadow-red-200">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22v-8"/>
                    <path d="M12 14c0-4 3-7 7-7 0 4-3 7-7 7z"/>
                    <path d="M12 18c0-3-2-5-5-5 0 3 2 5 5 5z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-black text-gray-900 tracking-tight flex items-center gap-1.5">
                    grooow <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-red-50 text-[#FF2442] font-bold border border-red-100">免配置直接用</span>
                </h1>
                <p class="text-xs text-gray-400">小红书爆款文案 · 一键生成</p>
            </div>
        </div>

        <button @click="showCustomKey = !showCustomKey" class="p-2 rounded-xl text-gray-400 hover:text-gray-600 hover:bg-gray-200/60 transition" title="自定义设置">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </header>

    <!-- Optional Custom API Key (Hidden by default) -->
    <div v-if="showCustomKey" class="mb-4 bg-white p-4 rounded-2xl border border-gray-200 shadow-sm text-xs space-y-2">
        <div class="flex items-center justify-between">
            <span class="font-bold text-gray-700">自定义 Gemini API Key (可选)</span>
            <button @click="showCustomKey = false" class="text-gray-400 hover:text-gray-600">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <p class="text-[11px] text-gray-400">已默认开启免费 AI 通道，无需填写也能正常使用。如需绑定私有 Key 可在此粘贴：</p>
        <div class="flex gap-2">
            <input type="password" v-model="customKey" placeholder="默认使用免费通道 (无需填写)" 
                   class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs font-mono outline-none focus:border-[#FF2442] focus:bg-white">
            <button @click="saveCustomKey" class="px-4 py-2 bg-gray-800 text-white font-bold rounded-xl shrink-0">
                保存
            </button>
        </div>
    </div>

    <!-- Main Creation Form -->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 space-y-4">
        
        <!-- Textarea Input -->
        <div>
            <textarea 
                v-model="prompt" 
                rows="4" 
                placeholder="写下你想分享的内容、灵感或核心卖点...&#10;例：周末在静安区打卡了一家超隐秘的复古咖啡馆，巴斯克蛋糕绝了，拍照很出片！📸"
                class="w-full bg-gray-50/80 border border-gray-200/80 rounded-2xl p-3.5 text-sm text-gray-800 placeholder-gray-400 outline-none focus:bg-white focus:border-[#FF2442] focus:ring-2 focus:ring-red-50 transition resize-none"></textarea>
        </div>

        <!-- Optional Image Upload -->
        <div>
            <input type="file" ref="fileInput" class="hidden" accept="image/*" @change="onFileChange">
            
            <button v-if="!imagePreview" @click="$refs.fileInput.click()" 
                    class="w-full py-2.5 px-3 rounded-2xl border border-dashed border-gray-300 hover:border-[#FF2442] bg-gray-50/50 hover:bg-red-50/30 text-gray-500 text-xs font-medium flex items-center justify-center gap-2 transition">
                <svg class="w-4 h-4 text-[#FF2442]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <span>添加图片（可选）</span>
            </button>

            <!-- Image Preview Card -->
            <div v-else class="relative rounded-2xl overflow-hidden border border-gray-200 bg-gray-50 h-28 flex items-center justify-center">
                <img :src="imagePreview" alt="预览" class="w-full h-full object-contain">
                <button @click="removeImage" class="absolute top-2 right-2 bg-black/60 hover:bg-black text-white rounded-full p-1 shadow transition">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </div>

        <!-- Submit Button -->
        <button 
            @click="generate" 
            :disabled="loading || !prompt.trim()" 
            class="w-full bg-gradient-to-r from-[#FF2442] to-[#FF4760] hover:from-[#E01633] hover:to-[#EB304B] text-white font-bold py-3.5 px-4 rounded-2xl transition flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed shadow-md shadow-red-200 active:scale-[0.99]">
            <!-- Spinner Icon -->
            <svg v-if="loading" class="animate-spin w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <!-- Sparkle Icon -->
            <svg v-else class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L14.4 8.6L21 11L14.4 13.4L12 20L9.6 13.4L3 11L9.6 8.6L12 2Z"></path>
            </svg>
            <span class="text-sm tracking-wide">{{ loading ? 'AI 正在深度构思爆款文案...' : '✨ 一键生成爆款文案' }}</span>
        </button>

    </div>

    <!-- Result Output Card -->
    <div v-if="result" class="mt-5 bg-white rounded-3xl p-5 shadow-sm border border-gray-100 space-y-4">
        
        <div class="flex items-center justify-between pb-3 border-b border-gray-100">
            <span class="text-xs font-bold text-gray-800 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-[#FF2442]"></span>
                生成结果
            </span>
            <button @click="copyText" class="text-xs font-bold text-[#FF2442] hover:underline flex items-center gap-1">
                <svg v-if="copied" class="w-3.5 h-3.5 text-green-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                <svg v-else class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span>{{ copied ? '已复制！' : '一键复制' }}</span>
            </button>
        </div>

        <!-- Result Text Area -->
        <div class="text-sm text-gray-800 leading-relaxed whitespace-pre-wrap selection:bg-red-100 font-normal">
            {{ result }}
        </div>

        <!-- Big Copy Button -->
        <div class="pt-2">
            <button @click="copyText" class="w-full py-3.5 bg-[#FF2442] hover:bg-[#E01633] text-white text-xs font-bold rounded-2xl shadow-sm shadow-red-100 transition flex items-center justify-center gap-2 active:scale-[0.99]">
                <svg v-if="copied" class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                <svg v-else class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span>{{ copied ? '已复制全部文案到剪贴板！' : '一键复制全部文案' }}</span>
            </button>
        </div>
    </div>

    <!-- Clean Footer -->
    <footer class="mt-8 text-center text-xs text-gray-400 space-y-1">
        <p>📱 手机安装：用 Safari 打开点击「分享 ➔ 添加到主屏幕」即可全屏使用</p>
    </footer>

</div>

<!-- Vue Application Script -->
<script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            const customKey = ref(localStorage.getItem('grooow_custom_key') || '');
            const showCustomKey = ref(false);

            const prompt = ref('');
            const fileInput = ref(null);
            const imageFile = ref(null);
            const imagePreview = ref('');

            const loading = ref(false);
            const result = ref('');
            const copied = ref(false);

            const saveCustomKey = () => {
                localStorage.setItem('grooow_custom_key', customKey.value.trim());
                showCustomKey.value = false;
                alert('设置已保存');
            };

            const onFileChange = (e) => {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    imageFile.value = file;
                    imagePreview.value = URL.createObjectURL(file);
                }
            };

            const removeImage = () => {
                imageFile.value = null;
                imagePreview.value = '';
                if (fileInput.value) fileInput.value.value = '';
            };

            const fileToBase64 = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                });
            };

            // Smart Xiaohongshu Rule Engine (Instant high-conversion copy generator)
            const generateSmartLocalCopy = (text) => {
                const isFood = /咖啡|吃|甜品|餐|肉|奶茶|火锅|店|蛋糕|好吃|美味|探店/.test(text);
                const isFashion = /穿搭|衣服|裙|裤|鞋|显瘦|氛围|包包|外套|气质/.test(text);
                const isBeauty = /美妆|护肤|脸|皮肤|水乳|精华|口红|妆容|眼影|防晒/.test(text);
                const isTravel = /旅行|玩|景点|酒店|民宿|旅游|攻略|周末|打卡|出游/.test(text);

                let title = `✨ 谁懂啊！${text.slice(0, 14)}真的太绝了🔥`;
                let categoryTags = ['#小红书爆款笔记', '#生活记录', '#今日分享'];

                if (isFood) {
                    title = `🔥 亲测不踩雷！被问了800遍的宝藏神仙店🤤`;
                    categoryTags = ['#探店打卡', '#美食日常', '#周末去哪儿', '#宝藏店铺', '#吃货必看'];
                } else if (isFashion) {
                    title = `🎀 被夸爆的氛围感穿搭！高级又显瘦✨`;
                    categoryTags = ['#每日穿搭', '#OOTD', '#氛围感穿搭', '#显瘦穿搭', '#女生穿搭'];
                } else if (isBeauty) {
                    title = `💡 终于找到了！按头安利给所有姐妹的神仙好物💄`;
                    categoryTags = ['#护肤分享', '#爱用物推荐', '#美妆好物', '#沉浸式护肤', '#平价好物'];
                } else if (isTravel) {
                    title = `📸 建议永久收藏！超治愈的宝藏打卡攻略🌿`;
                    categoryTags = ['#旅行推荐', '#周末去哪玩', '#拍照圣地', '#治愈系风景', '#小众旅行地'];
                }

                const body = `【爆款备选标题】：
1. ${title}
2. 💡 劝所有人都去试一次！直接封神！
3. 📸 藏不住了！后悔没早点发现这个宝藏...

------------
【正文排版】：
姐妹们！今天必须来给你们狠狠安利一波✨

${text}

👉 真实体验亮点总结：
🌟 整体氛围感直接拉满，随手一拍都超级出片📸
🌟 细节处理特别到位，完全超出预期，幸福感爆棚！
🌟 性价比和体验感都在线，属于无限次回购/二刷系列～

真的闭眼入不踩雷，建议赶紧点赞收藏⭐ 叫上你的闺蜜/饭搭子一起冲！

💬 姐妹们还有什么私藏推荐？欢迎在评论区一起交流呀～

------------
【热门标签】：
${categoryTags.join(' ')}`;

                return body;
            };

            const generate = async () => {
                if (!prompt.value.trim()) return;

                loading.value = true;
                result.value = '';
                copied.value = false;

                const systemInstruction = `你是一个深谙小红书 10w+ 爆款逻辑的顶级文案创作专家。
请根据用户的描述创作极具吸引力的小红书文案。
格式要求：
1. 3个吸睛爆款标题（带 Emoji，制造好奇与反差感）
2. 正文分段清晰、多留白呼吸感、巧妙穿插网感 Emoji（✨🔥📸💡🎀）、语气亲切真诚如闺蜜分享
3. 结尾附带 4~6 个热门标签话题（#...）
4. 直接输出最终文案，不加任何多余说明。`;

                // 1. Try Custom Gemini API Key if configured
                if (customKey.value.trim()) {
                    try {
                        const requestBody = {
                            contents: [{ parts: [{ text: `${systemInstruction}\n\n用户描述：${prompt.value}` }] }]
                        };
                        if (imageFile.value) {
                            const base64 = await fileToBase64(imageFile.value);
                            requestBody.contents[0].parts.push({
                                inline_data: { mime_type: imageFile.value.type, data: base64 }
                            });
                        }
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${customKey.value.trim()}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(requestBody)
                        });
                        const data = await res.json();
                        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) {
                            result.value = text.trim();
                            loading.value = false;
                            return;
                        }
                    } catch (e) {
                        console.warn('Custom key failed, falling back...', e);
                    }
                }

                // 2. Try Free Puter AI Engine
                if (window.puter && window.puter.ai) {
                    try {
                        const fullPrompt = `${systemInstruction}\n\n用户分享内容：${prompt.value}`;
                        const response = await Promise.race([
                            puter.ai.chat(fullPrompt, { model: 'gpt-4o-mini' }),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000))
                        ]);

                        let text = '';
                        if (typeof response === 'string') text = response;
                        else if (response && response.message && response.message.content) text = response.message.content;
                        else if (response && response.text) text = response.text;
                        else if (response) text = response.toString();

                        if (text && text.length > 20) {
                            result.value = text.trim();
                            loading.value = false;
                            return;
                        }
                    } catch (puterErr) {
                        console.warn('Puter AI fallback:', puterErr);
                    }
                }

                // 3. Guaranteed Smart Local Generation
                await new Promise(r => setTimeout(r, 600));
                result.value = generateSmartLocalCopy(prompt.value);
                loading.value = false;
            };

            const copyText = async () => {
                if (!result.value) return;
                try {
                    await navigator.clipboard.writeText(result.value);
                    copied.value = true;
                    setTimeout(() => copied.value = false, 2000);
                } catch (e) {
                    alert('已生成，请长按文本复制');
                }
            };

            return {
                customKey, showCustomKey, saveCustomKey,
                prompt, fileInput, imageFile, imagePreview, onFileChange, removeImage,
                loading, result, copied, generate, copyText
            };
        }
    }).mount('#app');

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
    }
</script>
</body>
</html>
